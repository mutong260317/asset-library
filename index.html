  .card { background: #fff; border-radius: 10px; padding: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .card .num { font-size: 20px; font-weight: 700; color: #1A2B4A; }
  .card .lbl { font-size: 11px; color: #8A919B; margin-top: 2px; }
  .sec { background: #fff; border-radius: 10px; padding: 14px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .sec h2 { font-size: 15px; color: #1A2B4A; margin-bottom: 8px; }
  #chart { width: 100%; height: 340px; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .filters select { padding: 6px 8px; border: 1px solid #D5D9E0; border-radius: 6px; font-size: 13px; background: #fff; }
  .tblwrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 780px; }
  th { background: #EEF1F6; color: #444; text-align: left; padding: 8px 6px; white-space: nowrap; position: sticky; top: 0; }
  td { padding: 7px 6px; border-bottom: 1px solid #EEF0F3; white-space: nowrap; }
  tr:hover td { background: #F7F9FC; }
  .tag { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 11px; }
  .tag.A { background: #E7F0FD; color: #1A5FB4; }
  .tag.US { background: #E8F5EE; color: #1C7A4D; }
  .tag.low { background: #CFF0DC; color: #1C6B3E; }
  .tag.high { background: #FBE3E0; color: #B23A2E; }
  .tag.warn { background: #FFF3D6; color: #9A6B00; }
  .vd { font-size: 11px; color: #555; white-space: normal; min-width: 150px; }
  .mt { margin-top: 8px; font-size: 11px; color: #8A919B; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin: 6px 0 2px; font-size: 12px; color: #555; }
  .lg { display: inline-flex; align-items: center; gap: 4px; }
  .sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
</style>
</head>

    <div id="chart"></div>
    <div class="mt">点位为初步定位估算，逐只核验中；虚线为中位分界。</div>

</div>

<script>
(function () {
  var A = window.ASSETS;
  var list = A.assets;
  document.getElementById('subtitle').textContent = '更新：' + A.updated + ' ｜ 方法：底层结构→康波定位→估值位置→宏观环境，周期为王不硬配';
  var aNum = list.filter(function (x) { return x.m === 'A'; }).length;
  var usNum = list.filter(function (x) { return x.m === 'US'; }).length;
  var posNum = list.filter(function (x) { return x.cyc != null; }).length;
  document.getElementById('cards').innerHTML =
    '<div class="card"><div class="num">' + list.length + '</div><div class="lbl">已建档资产</div></div>' +
    '<div class="card"><div class="num">' + aNum + ' / ' + usNum + '</div><div class="lbl">A股 / 美股</div></div>' +
    '<div class="card"><div class="num">' + posNum + '</div><div class="lbl">已完成周期定位</div></div>' +
    '<div class="card"><div class="num">周期为王</div><div class="lbl">不硬配比例</div></div>';
  var cats = [];
  list.forEach(function (x) { if (cats.indexOf(x.cat) < 0) cats.push(x.cat); });
  var fCat = document.getElementById('fCat');
  cats.forEach(function (c) {
    var o = document.createElement('option');
    o.value = c; o.textContent = c;
    fCat.appendChild(o);
  });
  var pts = list.filter(function (x) { return x.cyc != null && x.val != null; })
    .map(function (x) {
      var color = '#5B8DD6';
      if (x.cyc <= 40 && x.val <= 45) color = '#1C3D2E';
      if (x.cyc >= 60 && x.val >= 60) color = '#C06B5A';
      return { x: x.cyc, y: x.val, name: x.n, color: color };
    });
  drawChart('chart', pts);
  function drawChart(id, pts) {
    var holder = document.getElementById(id);
    var W = holder.clientWidth || 360;
    var H = 340;
    var dpr = window.devicePixelRatio || 1;
    var cv = document.createElement('canvas');
    cv.width = W * dpr; cv.height = H * dpr;
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    holder.innerHTML = '';
    holder.appendChild(cv);
    var ctx = cv.getContext('2d');
    ctx.scale(dpr, dpr);
    var padL = 48, padR = 74, padT = 24, padB = 42;
    var plotW = W - padL - padR, plotH = H - padT - padB;
    function px(x) { return padL + (x / 100) * plotW; }
    function py(y) { return padT + (100 - y) / 100 * plotH; }
    ctx.strokeStyle = '#E5E8EC'; ctx.lineWidth = 1;
    for (var g = 0; g <= 4; g++) {
      var gx = px(g * 25), gy = py(g * 25);
      ctx.beginPath(); ctx.moveTo(padL, gy); ctx.lineTo(padL + plotW, gy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(gx, padT); ctx.lineTo(gx, padT + plotH); ctx.stroke();
    }
    ctx.setLineDash([5, 5]); ctx.strokeStyle = '#B7BDC7';
    ctx.beginPath(); ctx.moveTo(padL, py(50)); ctx.lineTo(padL + plotW, py(50)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(px(50), padT); ctx.lineTo(px(50), padT + plotH); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#555'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
    for (var gi = 0; gi <= 4; gi++) {
      ctx.fillText(gi * 25, px(gi * 25), padT + plotH + 14);
      ctx.fillText(gi * 25, padL - 8, py(gi * 25) + 3);
    }
    ctx.save(); ctx.translate(padL - 30, padT + plotH / 2); ctx.rotate(-Math.PI / 2);
    ctx.fillStyle = '#666'; ctx.textAlign = 'center'; ctx.fillText('估值分位', 0, 0); ctx.restore();
    ctx.fillStyle = '#666'; ctx.textAlign = 'center';
    ctx.fillText('周期位置 →', padL + plotW / 2, padT + plotH + 26);
    pts.forEach(function (p) {
      var x = px(p.x), y = py(p.y);
      ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI * 2);
      ctx.fillStyle = p.color; ctx.fill();
      ctx.fillStyle = '#333'; ctx.textAlign = 'left'; ctx.font = '9px sans-serif';
      ctx.fillText(p.name, x + 10, y + 3);
    });
  }
  window.addEventListener('resize', function () { drawChart('chart', pts); });
  function parseSize(s) {
    if (!s) return -1;
    var m = s.match(/(\d+(?:\.\d+)?)/);
    if (!m) return -1;
    var v = parseFloat(m[1]);
    if (s.indexOf('T') >= 0) v *= 1000;
    if (s.indexOf('B') >= 0) v *= 1;
    return v;
  }
  function render() {
    var fm = document.getElementById('fMarket').value;
    var fc = document.getElementById('fCat').value;
    var fs = document.getElementById('fSort').value;
    var rows = list.filter(function (x) {
      return (!fm || x.m === fm) && (!fc || x.cat === fc);
    });
    if (fs === 'size') rows = rows.slice().sort(function (a, b) { return parseSize(b.sz) - parseSize(a.sz); });
    else if (fs === 'fee') rows = rows.slice().sort(function (a, b) { return parseFloat(a.fee) - parseFloat(b.fee); });
    else rows = rows.slice().sort(function (a, b) { return (a.c < b.c ? -1 : 1); });
    var html = '';
    rows.forEach(function (x) {
      var pmTxt = x.pm || '—';
      var pmTag = '';
      if (x.pm && x.pm.indexOf('+') === 0) pmTag = ' <span class="tag high">溢价</span>';
      else if (x.pm && x.pm.indexOf('-') === 0) pmTag = ' <span class="tag low">折价</span>';
      var feeTag = parseFloat(x.fee) <= 0.30 ? '<span class="tag low">低费</span>' : (parseFloat(x.fee) >= 0.60 ? '<span class="tag warn">中高费</span>' : '');
      var w = x.w ? (x.w.y != null ? x.w.y + '%' : '—') : '—';
      html += '<tr><td><b>' + x.c + '</b></td><td>' + x.n + '</td>' +
        '<td><span class="tag ' + x.m + '">' + (x.m === 'A' ? 'A股' : '美股') + '</span></td>' +
        '<td>' + x.cat + '</td><td>' + x.sz + '</td><td>' + x.fee + ' ' + feeTag + '</td>' +
        '<td>' + pmTxt + pmTag + '</td><td>' + x.u + '</td>' +
        '<td class="vd">' + (x.vd || '—') + '</td><td>' + w + '</td></tr>';
    });
    document.getElementById('tbody').innerHTML = html || '<tr><td colspan="10" style="text-align:center;color:#999">无匹配资产</td></tr>';
  }
  ['fMarket', 'fCat', 'fSort'].forEach(function (id) {
    document.getElementById(id).addEventListener('change', render);
  });
  render();
})();
</script>
</body>
</html>
